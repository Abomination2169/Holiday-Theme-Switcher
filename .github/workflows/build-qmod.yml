name: Build Holiday Theme Switcher Quest QMOD
on:
  push:
    branches: [experimental/beat-saber-1.45.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original seasonal decoration assets
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://raw.githubusercontent.com/Abomination2169/Halloween-Theme/14c5220b042e6ac84f37978ca06aeb6dd3dd9c1f/assets/pumpkin_left.png -o assets/halloween_pumpkin_left.png
          curl -fL --retry 3 https://raw.githubusercontent.com/Abomination2169/Halloween-Theme/14c5220b042e6ac84f37978ca06aeb6dd3dd9c1f/assets/pumpkin_right.png -o assets/halloween_pumpkin_right.png
          curl -fL --retry 3 https://raw.githubusercontent.com/Abomination2169/Thanksgiving-Theme/d30af27ff583e86a69eae8b8fa136c5432fbae34/assets/pumpkin_left.png -o assets/thanksgiving_pumpkin_left.png
          curl -fL --retry 3 https://raw.githubusercontent.com/Abomination2169/Thanksgiving-Theme/d30af27ff583e86a69eae8b8fa136c5432fbae34/assets/pumpkin_right.png -o assets/thanksgiving_pumpkin_right.png
          curl -fL --retry 3 https://raw.githubusercontent.com/Abomination2169/Thanksgiving-Theme/d30af27ff583e86a69eae8b8fa136c5432fbae34/assets/thanksgiving_harvest -o assets/thanksgiving_harvest
          test "$(stat -c %s assets/thanksgiving_pumpkin_left.png)" -gt 1000000
          test "$(stat -c %s assets/thanksgiving_pumpkin_right.png)" -gt 1000000
      - name: Fetch licensed original seasonal audio
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://raw.githubusercontent.com/Abomination2169/Halloween-Theme/14c5220b042e6ac84f37978ca06aeb6dd3dd9c1f/FileCopies/Ghostly_Horror_Menu.ogg -o Ghostly_Horror_Menu.ogg
          curl -fL --retry 3 https://raw.githubusercontent.com/Abomination2169/Thanksgiving-Theme/d30af27ff583e86a69eae8b8fa136c5432fbae34/assets/Thanksgiving-Gobble-Quiet-Phrase.ogg -o Thanksgiving-Gobble-Quiet-Phrase.ogg
          test "$(stat -c %s Ghostly_Horror_Menu.ogg)" -gt 1000000
          test "$(stat -c %s Thanksgiving-Gobble-Quiet-Phrase.ogg)" -gt 10000
      - name: Fetch New Years crystal ball artwork
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://raw.githubusercontent.com/Abomination2169/New-Years-Theme/9509a3efa1cc4ffe0bbab5c5e2f44e91337ed9b5/assets/new_year_crystal_ball.png -o assets/new_year_crystal_ball.png
          test "$(stat -c %s assets/new_year_crystal_ball.png)" -gt 1000000
          curl -fL --retry 3 https://raw.githubusercontent.com/Abomination2169/New-Years-Theme/9509a3efa1cc4ffe0bbab5c5e2f44e91337ed9b5/assets/confetti_streamers.png -o assets/confetti_streamers.png
          test "$(stat -c %s assets/confetti_streamers.png)" -gt 100000
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip curl python3
      - name: Install QPM CLI
        run: |
          curl -fsSL "https://github.com/QuestPackageManager/QPM.CLI/releases/download/v1.5.12/qpm-linux-x64.zip" -o "$RUNNER_TEMP/qpm.zip"
          mkdir -p "$RUNNER_TEMP/qpm"
          unzip -q "$RUNNER_TEMP/qpm.zip" -d "$RUNNER_TEMP/qpm"
          QPM_BIN="$(find "$RUNNER_TEMP/qpm" -type f -name qpm | head -n 1)"
          test -n "$QPM_BIN"
          chmod +x "$QPM_BIN"
          sudo install "$QPM_BIN" /usr/local/bin/qpm
          qpm --version
      - name: Prepare dependencies and manifest
        run: |
          qpm ndk resolve -d
          for attempt in 1 2 3 4 5; do
            qpm restore && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 15
          done
          qpm qmod manifest
      - name: Configure and build native ARM64 library
        run: |
          NDK_TOOLCHAIN="$(find "$HOME/.local/share/QPM-RS/ndk" -path '*/build/cmake/android.toolchain.cmake' -print -quit)"
          test -n "$NDK_TOOLCHAIN"
          echo "ANDROID_NDK_HOME=${NDK_TOOLCHAIN%/build/cmake/android.toolchain.cmake}" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel
          test -s build/libseasonalthemes.so
      - name: Package and validate test QMOD
        run: |
          cp Ghostly_Horror_Menu.ogg Thanksgiving-Gobble-Quiet-Phrase.ogg build/
          qpm qmod zip --import mod.json --skip_build
          test -s SeasonalThemes.qmod
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('SeasonalThemes.qmod') as z:
              names=set(z.namelist())
              assert 'libseasonalthemes.so' in names
              manifest=json.loads(z.read('mod.json'))
              assert manifest['id']=='seasonalthemes'
              assert manifest['packageVersion']=='1.45.3_30054'
              assert 'Ghostly_Horror_Menu.ogg' in names
              assert 'Thanksgiving-Gobble-Quiet-Phrase.ogg' in names
              assert manifest['version']=='1.0.0-1453-dev.1'
              assert 'christmas-eve-aurora-jingle.ogg' in names
              assert 'dance_of_the_sugar_plum_fairy.ogg' in names
              assert not names.intersection({'carolofthebells.ogg', 'christmasspirit.ogg', 'deckthehalls.ogg', 'jinglebells.ogg'})
          print('Quest package validated.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Holiday-Theme-Switcher-1.45.3-Experimental-QMOD
          path: SeasonalThemes.qmod
          if-no-files-found: error
